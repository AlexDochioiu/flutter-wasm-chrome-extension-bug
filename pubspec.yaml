name: wasm_bug_report
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-ExtraLight.otf
          weight: 200
        - asset: assets/fonts/Manrope/Manrope-ExtraLightItalic.otf
          weight: 200
          style: italic
        - asset: assets/fonts/Manrope/Manrope-Light.otf
          weight: 300
        - asset: assets/fonts/Manrope/Manrope-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/Manrope/Manrope-Regular.otf
          weight: 400
        - asset: assets/fonts/Manrope/Manrope-RegularItalic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Manrope/Manrope-Medium.otf
          weight: 500
        - asset: assets/fonts/Manrope/Manrope-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/Manrope/Manrope-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Manrope/Manrope-SemiBoldItalic.otf
          weight: 600
          style: italic
        - asset: assets/fonts/Manrope/Manrope-Bold.otf
          weight: 700
        - asset: assets/fonts/Manrope/Manrope-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/Manrope/Manrope-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Manrope/Manrope-ExtraBoldItalic.otf
          weight: 800
          style: italic
